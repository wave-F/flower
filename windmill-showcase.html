<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FX Showcase</title>
    <link rel="stylesheet" href="./windmill-showcase.css" />
  </head>
  <body>
    <main class="showcase-app">
      <header class="showcase-header">
        <div>
          <p class="showcase-eyebrow">FX Preview</p>
          <h1 class="showcase-title">特效调试展示</h1>
          <p class="showcase-copy">单独放大查看风车与双光球特效，实时调参，并把结果写回主工程默认配置。</p>
        </div>
        <div class="showcase-controls">
          <button id="playShowcaseButton" class="showcase-button" type="button">重新播放</button>
          <button id="resetShowcaseButton" class="showcase-button showcase-button--secondary" type="button">重置目标</button>
        </div>
      </header>

      <div class="showcase-tabs" role="tablist" aria-label="特效页签">
        <button id="tabWindmill" class="showcase-tab is-active" type="button" role="tab" aria-selected="true" data-tab="windmill">风车</button>
        <button id="tabLightball" class="showcase-tab" type="button" role="tab" aria-selected="false" data-tab="lightball">双光球</button>
      </div>

      <section class="showcase-main">
        <div class="showcase-stage-shell">
          <div id="showcaseStage" class="showcase-stage" aria-label="effect showcase stage">
            <div class="showcase-board-glow"></div>

            <div id="showcaseBoardFrame" class="showcase-board-frame">
              <div id="showcaseBoard" class="showcase-board" aria-hidden="true"></div>

              <div id="showcaseWindmillScene" class="showcase-scene showcase-scene--active">
                <div class="showcase-target" data-target-slot="up" data-col="2" data-row="1">
                  <span class="target-core target-core--rose"></span>
                  <span class="target-ring"></span>
                </div>
                <div class="showcase-target" data-target-slot="right" data-col="3" data-row="2">
                  <span class="target-core target-core--sky"></span>
                  <span class="target-ring"></span>
                </div>
                <div class="showcase-target" data-target-slot="down" data-col="2" data-row="3">
                  <span class="target-core target-core--amber"></span>
                  <span class="target-ring"></span>
                </div>
                <div class="showcase-target" data-target-slot="left" data-col="1" data-row="2">
                  <span class="target-core target-core--violet"></span>
                  <span class="target-ring"></span>
                </div>

                <button id="showcaseWindmill" class="showcase-windmill" type="button" aria-label="风车展示" data-col="2" data-row="2">
                  <span class="windmill-shadow"></span>
                  <span class="windmill-blade windmill-blade--north"></span>
                  <span class="windmill-blade windmill-blade--east"></span>
                  <span class="windmill-blade windmill-blade--south"></span>
                  <span class="windmill-blade windmill-blade--west"></span>
                  <span class="windmill-core"></span>
                  <span class="windmill-spark"></span>
                </button>
              </div>

              <div id="showcaseLightballScene" class="showcase-scene showcase-scene--hidden">
                <button id="showcaseLightballPrimary" class="showcase-lightball" type="button" aria-label="主光球展示" data-col="1" data-row="2">
                  <span class="lightball-shadow"></span>
                  <span class="lightball-aura"></span>
                  <span class="lightball-core"></span>
                  <span class="lightball-spark"></span>
                </button>

                <button id="showcaseLightballSecondary" class="showcase-lightball showcase-lightball--secondary" type="button" aria-label="副光球展示" data-col="3" data-row="2">
                  <span class="lightball-shadow"></span>
                  <span class="lightball-aura"></span>
                  <span class="lightball-core"></span>
                  <span class="lightball-spark"></span>
                </button>
              </div>

              <div id="showcaseOverlay" class="showcase-overlay" aria-hidden="true"></div>
            </div>
          </div>
        </div>

        <aside class="showcase-debug-panel" aria-label="特效调试参数">
          <div class="debug-panel-header">
            <h2 class="debug-panel-title">调试面板</h2>
            <label class="debug-toggle">
              <input id="autoplayToggle" type="checkbox" checked />
              <span>循环播放</span>
            </label>
          </div>

          <div class="debug-actions">
            <button id="writeBackButton" class="showcase-button" type="button">写回主风车默认参数</button>
            <p id="writeBackStatus" class="debug-status" aria-live="polite">未写回</p>
          </div>

          <div id="windmillDebugPanel" class="debug-grid debug-grid--active">
            <label class="debug-control">
              <span>风时长</span>
              <output id="gustDurationValue">520ms</output>
              <input id="gustDurationInput" type="range" min="220" max="1400" step="10" value="520" />
            </label>

            <label class="debug-control">
              <span>循环间隔</span>
              <output id="loopDelayValue">900ms</output>
              <input id="loopDelayInput" type="range" min="0" max="2400" step="50" value="900" />
            </label>

            <label class="debug-control">
              <span>命中时机</span>
              <output id="hitDelayRatioValue">60%</output>
              <input id="hitDelayRatioInput" type="range" min="35" max="85" step="1" value="60" />
            </label>

            <label class="debug-control">
              <span>命中反馈时长</span>
              <output id="hitDurationValue">280ms</output>
              <input id="hitDurationInput" type="range" min="120" max="800" step="10" value="280" />
            </label>

            <label class="debug-control">
              <span>风团厚度</span>
              <output id="widthScaleValue">100%</output>
              <input id="widthScaleInput" type="range" min="60" max="180" step="1" value="100" />
            </label>

            <label class="debug-control">
              <span>风团弯曲</span>
              <output id="curlScaleValue">100%</output>
              <input id="curlScaleInput" type="range" min="40" max="180" step="1" value="100" />
            </label>

            <label class="debug-control">
              <span>风层分散</span>
              <output id="spreadScaleValue">100%</output>
              <input id="spreadScaleInput" type="range" min="40" max="180" step="1" value="100" />
            </label>

            <label class="debug-control">
              <span>风屑数量</span>
              <output id="dustCountValue">4</output>
              <input id="dustCountInput" type="range" min="0" max="12" step="1" value="4" />
            </label>

            <label class="debug-control">
              <span>风屑尺寸</span>
              <output id="dustSizeValue">100%</output>
              <input id="dustSizeInput" type="range" min="40" max="180" step="1" value="100" />
            </label>

            <label class="debug-control">
              <span>风屑摆动</span>
              <output id="dustWobbleValue">100%</output>
              <input id="dustWobbleInput" type="range" min="40" max="220" step="1" value="100" />
            </label>
          </div>

          <div id="lightballDebugPanel" class="debug-grid debug-grid--hidden">
            <label class="debug-control">
              <span>公转时长</span>
              <output id="lightballOrbitDurationValue">670ms</output>
              <input id="lightballOrbitDurationInput" type="range" min="200" max="3000" step="10" value="670" />
            </label>

            <label class="debug-control">
              <span>循环间隔</span>
              <output id="lightballLoopDelayValue">900ms</output>
              <input id="lightballLoopDelayInput" type="range" min="0" max="3000" step="50" value="900" />
            </label>

            <label class="debug-control">
              <span>公转速度</span>
              <output id="lightballOrbitSpeedValue">2.54 圈/秒</output>
              <input id="lightballOrbitSpeedInput" type="range" min="10" max="1200" step="1" value="254" />
            </label>

            <label class="debug-control">
              <span>停顿时长</span>
              <output id="lightballStopDurationValue">90ms</output>
              <input id="lightballStopDurationInput" type="range" min="0" max="600" step="10" value="90" />
            </label>

            <label class="debug-control">
              <span>对撞时长</span>
              <output id="lightballCollisionDurationValue">140ms</output>
              <input id="lightballCollisionDurationInput" type="range" min="60" max="500" step="10" value="140" />
            </label>

            <label class="debug-control">
              <span>停下半径</span>
              <output id="lightballStopRadiusScaleValue">88%</output>
              <input id="lightballStopRadiusScaleInput" type="range" min="30" max="100" step="1" value="88" />
            </label>

            <label class="debug-control">
              <span>公转呼吸</span>
              <output id="lightballOrbitStretchScaleValue">12%</output>
              <input id="lightballOrbitStretchScaleInput" type="range" min="0" max="60" step="1" value="12" />
            </label>

            <label class="debug-control">
              <span>对撞峰值缩放</span>
              <output id="lightballCollisionPeakScaleValue">124%</output>
              <input id="lightballCollisionPeakScaleInput" type="range" min="80" max="200" step="1" value="124" />
            </label>

            <label class="debug-control">
              <span>对撞结束缩放</span>
              <output id="lightballCollisionEndScaleValue">22%</output>
              <input id="lightballCollisionEndScaleInput" type="range" min="5" max="100" step="1" value="22" />
            </label>

            <label class="debug-control">
              <span>黑场强度</span>
              <output id="lightballFocusOpacityValue">86%</output>
              <input id="lightballFocusOpacityInput" type="range" min="0" max="100" step="1" value="86" />
            </label>

            <label class="debug-control">
              <span>黑场淡入</span>
              <output id="lightballFocusFadeInDurationValue">180ms</output>
              <input id="lightballFocusFadeInDurationInput" type="range" min="40" max="800" step="10" value="180" />
            </label>

            <label class="debug-control">
              <span>黑场淡出</span>
              <output id="lightballFocusFadeOutDurationValue">170ms</output>
              <input id="lightballFocusFadeOutDurationInput" type="range" min="40" max="800" step="10" value="170" />
            </label>

            <label class="debug-control">
              <span>爆闪时长</span>
              <output id="lightballFlashDurationValue">340ms</output>
              <input id="lightballFlashDurationInput" type="range" min="80" max="900" step="10" value="340" />
            </label>

            <label class="debug-control">
              <span>冲击波时长</span>
              <output id="lightballShockwaveDurationValue">420ms</output>
              <input id="lightballShockwaveDurationInput" type="range" min="120" max="1200" step="10" value="420" />
            </label>

            <label class="debug-control">
              <span>冲击波范围</span>
              <output id="lightballShockwaveSizeMultiplierValue">9.4x</output>
              <input id="lightballShockwaveSizeMultiplierInput" type="range" min="20" max="160" step="1" value="94" />
            </label>

            <label class="debug-control">
              <span>抖动强度</span>
              <output id="lightballShockwaveShakeStrengthValue">1.6</output>
              <input id="lightballShockwaveShakeStrengthInput" type="range" min="0" max="500" step="5" value="160" />
            </label>
          </div>
        </aside>
      </section>
    </main>

    <script defer src="./src/demo/windmillShowcase.js"></script>
  </body>
</html>
