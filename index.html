<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Grid Fall Prototype</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="loadingOverlay" class="loading-overlay" role="status" aria-live="polite">
      <div class="loading-stage" aria-hidden="true">
        <span class="loading-flower loading-flower--left"></span>
        <span class="loading-flower loading-flower--center"></span>
        <span class="loading-flower loading-flower--right"></span>
      </div>
      <div class="loading-copy">
        <h1 id="loadingMessage" class="loading-title">加载中</h1>
      </div>
    </div>
    <div class="global-debug-actions" aria-label="debug actions">
      <button id="debugWindmillButton" class="debug-button debug-button--windmill" type="button">测试风车</button>
      <button id="debugHiveButton" class="debug-button debug-button--hive" type="button">测试蜂巢</button>
      <button id="debugLevelPickerButton" class="debug-button debug-button--level" type="button" aria-expanded="false" aria-controls="debugLevelPanel">选关</button>
      <div id="debugLevelPanel" class="debug-level-panel" hidden>
        <label class="debug-level-label" for="debugLevelSelect">跳转关卡</label>
        <div class="debug-level-controls">
          <select id="debugLevelSelect" class="debug-level-select" aria-label="选择关卡"></select>
          <button id="debugLevelJumpButton" class="debug-level-jump" type="button">跳转</button>
        </div>
      </div>
    </div>
    <main class="app">
      <section class="phone-frame">
        <section class="game-screen">
          <div id="fpsCounter" class="fps-counter" aria-hidden="true">FPS: --</div>
          <header class="hud">
            <div class="hud-bar">
              <div class="hero-badge" aria-hidden="true">
                <div class="hero-badge-frame">
                  <span class="hero-badge-flower"></span>
                  <span class="hero-badge-caption">关卡</span>
                  <span id="levelBadge" class="hero-badge-level">1</span>
                </div>
              </div>
              <section class="hud-card hud-card--goals" aria-labelledby="goalPanelTitle">
                <h2 id="goalPanelTitle" class="hud-card-title">目标</h2>
                <ul id="goalList" class="goal-list" aria-label="关卡目标"></ul>
              </section>
              <section class="hud-card hud-card--moves" aria-labelledby="movePanelTitle">
                <h2 id="movePanelTitle" class="hud-card-title">步数</h2>
                <p id="moveLabel" class="move-value">10</p>
              </section>
            </div>
          </header>
          <div class="board-shell">
            <div id="board" class="board" aria-label="game board"></div>
            <div id="tileLayer" class="tile-layer" aria-hidden="true"></div>
          </div>
          <section class="collection-tray-panel" aria-labelledby="collectionTrayTitle">
            <div class="collection-tray-header">
              <h2 id="collectionTrayTitle" class="collection-tray-title">槽位</h2>
              <span id="collectionTrayCount" class="collection-tray-count">0 / 7</span>
            </div>
            <div id="collectionTray" class="collection-tray" aria-label="底部收集槽"></div>
          </section>
          <div id="tutorialGuide" class="tutorial-guide" aria-hidden="true" hidden>
            <img id="tutorialHand" class="tutorial-hand" src="./assets/HandPointer.png" alt="" />
            <div id="tutorialTip" class="tutorial-tip">点击花朵，收进下方槽位</div>
          </div>
          <div id="persistentHint" class="persistent-hint" hidden>点击花朵，收进下方 7 个槽位</div>
          <div id="levelOverlay" class="level-overlay" role="dialog" aria-modal="true" aria-labelledby="levelOverlayTitle" hidden>
            <div class="level-overlay-card">
              <h2 id="levelOverlayTitle" class="level-overlay-title">关卡完成</h2>
              <p id="levelOverlayDetail" class="level-overlay-detail"></p>
              <button id="nextLevelButton" class="level-overlay-button" type="button">下一关</button>
            </div>
          </div>
        </section>
        <div id="flyLayer" class="fly-layer" aria-hidden="true"></div>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
